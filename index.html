<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bgcolor">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Post App</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn button" type="submit">Search</button>
            </form>
        </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-5 col-lg-4 mt-2">
                <div class="card" style="width: 18rem;">
                    <div class="m-3">
                        <label for="exampleFormControlInput1" class="form-label">Title</label>
                        <input type="email" class="form-control" id="title" placeholder="Enter your title">
                    </div>
                    <div class="m-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3"
                            placeholder="Leave a Description here"></textarea>
                    </div>
                    <button class="btn bgcolor m-2 postbtn" onclick="post()">Post</button>
                </div>
            </div>
            <div class="col-12 col-md-7 col-lg-8" id="postcontainer">
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>

</html>
